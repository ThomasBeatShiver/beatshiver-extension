<!doctype html>
<html><head><meta charset="utf-8"><title>fixture embed</title>
<style>body{margin:0;background:#222;color:#eee;font:12px monospace}</style></head>
<body>
<div id="player"></div>
<script>
// A stand-in player, served by the test at a real embed URL so the real content scripts match.
// KIND: 'pornhub' -> VAST-style pre-roll in its own element, then content, both in a CLOSED
//        shadow root; 'xvideos' -> plain light-DOM content video; 'soundcloud' -> a detached
//        new Audio() that is never put in the document.
// Tone as a blob URL: seekable, unlike a routed response without range support.
function tone(seconds, rate = 8000, freq = 330) {
  const n = Math.round(seconds * rate), b = new DataView(new ArrayBuffer(44 + n * 2));
  const w = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); b.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true);
  b.setUint32(24, rate, true); b.setUint32(28, rate * 2, true); b.setUint16(32, 2, true);
  b.setUint16(34, 16, true); w(36, 'data'); b.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) b.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * freq * i / rate) * 3000), true);
  return URL.createObjectURL(new Blob([b.buffer], { type: 'audio/wav' }));
}
const KIND = new URLSearchParams(location.search).get('kind') || 'xvideos';
const host = document.getElementById('player');
const fx = window.__fx = { kind: KIND };
document.body.append(KIND);
if (KIND === 'pornhub') {
  const root = host.attachShadow({ mode: 'closed' });
  root.innerHTML = '<div class="mgp_adRollContainer"><video id="ad" playsinline></video></div>'
                 + '<div class="mgp_videoWrapper"><video class="mgp_videoElement" playsinline></video></div>';
  const ad = root.getElementById('ad'), content = root.querySelector('.mgp_videoElement');
  content.src = tone(30);
  ad.src = tone(3);
  ad.addEventListener('ended', () => { ad.remove(); content.play(); });
  ad.play();
  fx.el = () => content;
} else if (KIND === 'soundcloud') {
  const a = new Audio(tone(30));
  a.play();
  fx.el = () => a;
} else {
  host.innerHTML = '<div id="html5video"><div id="hlsplayer"><video></video></div></div>';
  const v = host.querySelector('video');
  v.src = tone(30);
  v.play();
  fx.el = () => v;
}
fx.pause = () => fx.el().pause();
fx.play = () => fx.el().play();
fx.seek = t => { fx.el().currentTime = t; };
fx.rate = r => { fx.el().playbackRate = r; };
fx.state = () => { const e = fx.el(); return { t: e.currentTime, paused: e.paused, rate: e.playbackRate }; };
</script>
</body></html>
